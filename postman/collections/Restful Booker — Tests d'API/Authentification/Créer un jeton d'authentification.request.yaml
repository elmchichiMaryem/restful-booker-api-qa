$kind: http-request
description: US-02 · CT-02 — Le jeton est enregistré dans la variable `token`.
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaJeton)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaJeton")));
      });
      pm.test("Le jeton est une chaîne non vide", () => pm.expect(pm.response.json().token).to.be.a("string").and.not.empty);
      pm.collectionVariables.set("token", pm.response.json().token);
    language: text/javascript
order: 2000
