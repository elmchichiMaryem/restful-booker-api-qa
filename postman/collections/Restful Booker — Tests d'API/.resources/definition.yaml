$kind: collection
description: |-
  Collection de tests de l'API Restful Booker (https://restful-booker.herokuapp.com).

  **Exécution** : lancer la collection entière, dans l'ordre, avec l'environnement « Restful Booker — Démo ». Le jeton et les identifiants de réservation sont enregistrés dans des variables de collection et réutilisés par les requêtes suivantes.

  **Données isolées** : chaque dossier crée ses propres réservations (prénom unique) et les supprime à la fin.

  **Anomalies connues** : les tests préfixés `[BUG-xx — anomalie connue]` vérifient le comportement *attendu*. Ils réussissent tant que l'anomalie est présente et échouent dès qu'elle est corrigée, pour signaler qu'il faut mettre à jour la collection. Voir docs/qa/03_rapports_anomalies.md.
variables:
  schemaJeton: '{"type": "object", "required": ["token"], "additionalProperties": false, "properties": {"token": {"type": "string", "minLength": 1}}}'
  schemaReservation: '{"type": "object", "additionalProperties": false, "required": ["firstname", "lastname", "totalprice", "depositpaid", "bookingdates", "additionalneeds"], "properties": {"firstname": {"type": "string"}, "lastname": {"type": "string"}, "totalprice": {"type": "number"}, "depositpaid": {"type": "boolean"}, "bookingdates": {"type": "object", "required": ["checkin", "checkout"], "additionalProperties": false, "properties": {"checkin": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"}, "checkout": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"}}}, "additionalneeds": {"type": "string"}}}'
  schemaReservationCreee: '{"type": "object", "required": ["bookingid", "booking"], "additionalProperties": false, "properties": {"bookingid": {"type": "integer"}, "booking": {"type": "object", "additionalProperties": false, "required": ["firstname", "lastname", "totalprice", "depositpaid", "bookingdates", "additionalneeds"], "properties": {"firstname": {"type": "string"}, "lastname": {"type": "string"}, "totalprice": {"type": "number"}, "depositpaid": {"type": "boolean"}, "bookingdates": {"type": "object", "required": ["checkin", "checkout"], "additionalProperties": false, "properties": {"checkin": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"}, "checkout": {"type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$"}}}, "additionalneeds": {"type": "string"}}}}}'
  schemaListeIds: '{"type": "array", "items": {"type": "object", "required": ["bookingid"], "additionalProperties": false, "properties": {"bookingid": {"type": "integer"}}}}'
  jetonInvalide: jetonInvalide123
  motDePasseInvalide: mauvaisMotDePasse
  idInexistant: "999999999"
  token: ""
  prenomCrud: ""
  nomCrud: ""
  bookingId: ""
  reservationCrud: ""
  bookingIdBasic: ""
  reservationBasic: ""
  prenomFiltre: ""
  nomFiltre: ""
  bookingIdFiltre: ""
  reservationFiltre: ""
  prenomNeg: ""
  nomNeg: ""
  bookingIdNeg: ""
  reservationNeg: ""
scripts:
  - type: http:afterResponse
    code: |-
      // Test commun à toutes les requêtes : temps de réponse sous le seuil défini dans l'environnement
      const seuil = Number(pm.environment.get("maxResponseTime") || 3000);
      pm.test(`Temps de réponse < ${seuil} ms`, () => pm.expect(pm.response.responseTime).to.be.below(seuil));
    language: text/javascript
