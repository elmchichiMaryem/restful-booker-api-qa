$kind: http-request
description: US-03 — Données dédiées au test suivant.
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "firstname": "{{prenomCrud}}Basic",
      "lastname": "{{nomCrud}}",
      "totalprice": 150,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2026-11-01",
        "checkout": "2026-11-05"
      },
      "additionalneeds": "Petit-déjeuner"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaReservationCreee)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaReservationCreee")));
      });
      const corps = pm.response.json();
      pm.test("La réservation renvoyée correspond aux données envoyées", () => {
          pm.expect(corps.booking).to.eql(JSON.parse(pm.variables.replaceIn(pm.request.body.raw)));
      });
      pm.collectionVariables.set("bookingIdBasic", corps.bookingid);
      pm.collectionVariables.set("reservationBasic", JSON.stringify(corps.booking));
    language: text/javascript
order: 10000
