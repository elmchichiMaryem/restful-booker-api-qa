$kind: http-request
description: US-10 · CT-50.
url: "{{baseUrl}}/booking/{{bookingIdBasic}}"
method: DELETE
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 201", () => pm.response.to.have.status(201));
      pm.sendRequest({
          url: `${pm.environment.get("baseUrl")}/booking/${pm.collectionVariables.get("bookingIdBasic")}`,
          method: "GET"
      }, (err, res) => pm.test("La réservation supprimée est introuvable (404)", () => pm.expect(res.code).to.eql(404)));
    language: text/javascript
order: 11000
