$kind: http-request
description: US-03 · CT-06 — L'identifiant est enregistré dans `bookingId`.
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "firstname": "{{prenomCrud}}",
      "lastname": "{{nomCrud}}",
      "totalprice": 150,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2026-11-01",
        "checkout": "2026-11-05"
      },
      "additionalneeds": "Petit-déjeuner"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Prénom et nom uniques : nos données ne se mélangent pas à celles des autres utilisateurs de l'API
      const suffixe = Date.now().toString(36) + Math.floor(Math.random() * 1e4);
      pm.collectionVariables.set("prenomCrud", "Crud" + suffixe);
      pm.collectionVariables.set("nomCrud", "Postman" + suffixe);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaReservationCreee)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaReservationCreee")));
      });
      const corps = pm.response.json();
      pm.test("La réservation renvoyée correspond aux données envoyées", () => {
          pm.expect(corps.booking).to.eql(JSON.parse(pm.variables.replaceIn(pm.request.body.raw)));
      });
      pm.collectionVariables.set("bookingId", corps.bookingid);
      pm.collectionVariables.set("reservationCrud", JSON.stringify(corps.booking));
      pm.test("bookingid est un entier", () => pm.expect(Number.isInteger(corps.bookingid)).to.be.true);
    language: text/javascript
order: 1000
