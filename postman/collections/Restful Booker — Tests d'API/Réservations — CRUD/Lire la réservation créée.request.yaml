$kind: http-request
description: US-04 · CT-07, CT-24.
url: "{{baseUrl}}/booking/{{bookingId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaReservation)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaReservation")));
      });
      pm.test("Les données correspondent à la dernière version enregistrée", () => {
          pm.expect(pm.response.json()).to.eql(JSON.parse(pm.collectionVariables.get("reservationCrud")));
      });
    language: text/javascript
order: 2000
