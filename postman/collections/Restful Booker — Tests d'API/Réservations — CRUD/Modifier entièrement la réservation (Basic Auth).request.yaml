$kind: http-request
description: US-08 · CT-35 — Authentification Basic.
url: "{{baseUrl}}/booking/{{bookingId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "firstname": "{{prenomCrud}}",
      "lastname": "{{nomCrud}}",
      "totalprice": 180,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2026-11-01",
        "checkout": "2026-11-05"
      },
      "additionalneeds": "Parking"
    }
auth:
  type: basic
  credentials:
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaReservation)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaReservation")));
      });
      pm.test("La réponse contient les valeurs envoyées", () => {
          pm.expect(pm.response.json()).to.eql(JSON.parse(pm.variables.replaceIn(pm.request.body.raw)));
      });
      pm.collectionVariables.set("reservationCrud", JSON.stringify(pm.response.json()));
    language: text/javascript
order: 5000
