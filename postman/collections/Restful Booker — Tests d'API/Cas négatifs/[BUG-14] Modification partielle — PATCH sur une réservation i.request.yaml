$kind: http-request
name: "[BUG-14] Modification partielle — PATCH sur une réservation inexistante"
description: "US-09 · CT-39 — Attendu : 404."
url: "{{baseUrl}}/booking/{{idInexistant}}"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
  Cookie: token={{token}}
body:
  type: json
  content: |-
    {
      "firstname": "X"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test(`[BUG-14 — anomalie connue] Code HTTP attendu 404 (obtenu : ${pm.response.code})`, () => {
          pm.expect(pm.response.code, "BUG-14 semble corrigé : retirer le marquage d'anomalie connue").to.not.eql(404);
      });
    language: text/javascript
order: 28000
