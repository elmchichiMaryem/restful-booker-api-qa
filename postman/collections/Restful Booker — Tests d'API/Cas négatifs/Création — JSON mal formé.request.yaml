$kind: http-request
description: US-12 · CT-23.
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"firstname": "{{prenomNeg}}",'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 400", () => pm.response.to.have.status(400));
      pm.test("Corps de réponse : Bad Request", () => pm.expect(pm.response.text()).to.eql("Bad Request"));
      // Si l'API a créé une réservation à tort, on la supprime immédiatement (données isolées)
      let corpsCree = null;
      try { corpsCree = pm.response.json(); } catch (e) { /* corps non JSON : rien n'a été créé */ }
      if (corpsCree && corpsCree.bookingid) {
          pm.sendRequest({
              url: `${pm.environment.get("baseUrl")}/booking/${corpsCree.bookingid}`,
              method: "DELETE",
              header: { Cookie: `token=${pm.collectionVariables.get("token")}` }
          }, (err, res) => {
              pm.test("Nettoyage : réservation créée à tort supprimée", () => pm.expect(res.code).to.eql(201));
          });
      }
    language: text/javascript
order: 15000
