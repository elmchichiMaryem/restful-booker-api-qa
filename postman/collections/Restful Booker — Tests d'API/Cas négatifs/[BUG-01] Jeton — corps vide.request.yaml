$kind: http-request
description: "US-02 · CT-04 — Attendu : 400 sans jeton."
url: "{{baseUrl}}/auth"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Aucun jeton n'est délivré", () => pm.expect(pm.response.json()).to.not.have.property("token"));
      pm.test(`[BUG-01 — anomalie connue] Code HTTP attendu 400 (obtenu : ${pm.response.code})`, () => {
          pm.expect(pm.response.code, "BUG-01 semble corrigé : retirer le marquage d'anomalie connue").to.not.eql(400);
      });
    language: text/javascript
order: 3000
