$kind: http-request
description: "US-07 · CT-30 — Attendu : renvoyée (01/11 ≥ 01/11)."
url: "{{baseUrl}}/booking?firstname={{prenomFiltre}}&checkin=2026-11-01"
method: GET
queryParams:
  firstname: "{{prenomFiltre}}"
  checkin: 2026-11-01
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaListeIds)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaListeIds")));
      });
      pm.test("[BUG-12 — anomalie connue] La réservation devrait être renvoyée (arrivée ≥ date du filtre)", () => {
          const ids = pm.response.json().map(r => r.bookingid);
          const attenduRespecte = ids.includes(Number(pm.collectionVariables.get("bookingIdFiltre"))) === true;
          pm.expect(attenduRespecte, "BUG-12 semble corrigé : retirer le marquage d'anomalie connue").to.be.false;
      });
    language: text/javascript
order: 6000
