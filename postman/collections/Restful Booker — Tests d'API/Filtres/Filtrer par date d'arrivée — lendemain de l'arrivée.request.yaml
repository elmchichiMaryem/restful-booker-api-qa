$kind: http-request
description: US-07 · CT-53 — 01/11 < 02/11.
url: "{{baseUrl}}/booking?firstname={{prenomFiltre}}&checkin=2026-11-02"
method: GET
queryParams:
  firstname: "{{prenomFiltre}}"
  checkin: 2026-11-02
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaListeIds)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaListeIds")));
      });
      pm.test("Le résultat ne contient pas la réservation de test", () => {
          const ids = pm.response.json().map(r => r.bookingid);
          pm.expect(ids).not.to.include(Number(pm.collectionVariables.get("bookingIdFiltre")));
      });
    language: text/javascript
order: 7000
