$kind: http-request
description: Réservation du 01/11/2026 au 05/11/2026, au prénom unique.
url: "{{baseUrl}}/booking"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "firstname": "{{prenomFiltre}}",
      "lastname": "{{nomFiltre}}",
      "totalprice": 150,
      "depositpaid": true,
      "bookingdates": {
        "checkin": "2026-11-01",
        "checkout": "2026-11-05"
      },
      "additionalneeds": "Petit-déjeuner"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Prénom et nom uniques : nos données ne se mélangent pas à celles des autres utilisateurs de l'API
      const suffixe = Date.now().toString(36) + Math.floor(Math.random() * 1e4);
      pm.collectionVariables.set("prenomFiltre", "Filtre" + suffixe);
      pm.collectionVariables.set("nomFiltre", "Postman" + suffixe);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaReservationCreee)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaReservationCreee")));
      });
      const corps = pm.response.json();
      pm.test("La réservation renvoyée correspond aux données envoyées", () => {
          pm.expect(corps.booking).to.eql(JSON.parse(pm.variables.replaceIn(pm.request.body.raw)));
      });
      pm.collectionVariables.set("bookingIdFiltre", corps.bookingid);
      pm.collectionVariables.set("reservationFiltre", JSON.stringify(corps.booking));
    language: text/javascript
order: 1000
