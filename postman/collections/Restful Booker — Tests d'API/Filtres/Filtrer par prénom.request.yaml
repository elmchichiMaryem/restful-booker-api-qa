$kind: http-request
description: US-06 · CT-28.
url: "{{baseUrl}}/booking?firstname={{prenomFiltre}}"
method: GET
queryParams:
  firstname: "{{prenomFiltre}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Code HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Schéma JSON valide (schemaListeIds)", () => {
          pm.response.to.have.jsonSchema(JSON.parse(pm.collectionVariables.get("schemaListeIds")));
      });
      pm.test("Le résultat contient la réservation de test", () => {
          const ids = pm.response.json().map(r => r.bookingid);
          pm.expect(ids).to.include(Number(pm.collectionVariables.get("bookingIdFiltre")));
      });
    language: text/javascript
order: 3000
