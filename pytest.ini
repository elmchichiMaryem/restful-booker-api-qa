[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --html=reports/pytest/rapport-pytest.html
    --self-contained-html
    --reruns 1
    --reruns-delay 2
# --reruns 1 : l'API publique est réinitialisée périodiquement et partagée ; un test en échec est
# relancé une fois. Une vraie anomalie, déterministe, échoue aussi à la relance.
# Une anomalie connue corrigée (XPASS) fait échouer la suite : le marquage doit être retiré
xfail_strict = true
markers =
    smoke: parcours critiques, à exécuter en premier (rapide)
    regression: suite complète de non-régression
    contrat: validation de la structure des réponses (schémas JSON)
    securite: contrôle d'accès aux opérations protégées
